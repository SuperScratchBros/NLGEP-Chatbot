<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NLGEP Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
<link href="/static/nlgep.css" rel="stylesheet">
</head>
<body>
<nav aria-label="NLGEP navigation" id="nlSidebar">
  <div class="nl-logo"><i class="fas fa-earth-americas"></i><span>NLGEP</span></div>
  <a class="nl-nav active" href="/"><i class="fas fa-house"></i><span>Home</span></a>
  <a class="nl-nav" href="/chat"><i class="fas fa-comments"></i><span>Chat</span></a>
</nav>

<section class="nl-page">
  <div class="titlebar"><div class="nl-brand"><i class="fas fa-earth-americas"></i>NLGEP<span class="nl-beta">BETA</span></div></div>
  <div class="nl-body"><div class="nl-card" id="nlHomeBody">
    <span class="nl-orb o1"></span><span class="nl-orb o2"></span><span class="nl-orb o3"></span>
    <div class="nl-glass" id="nlHomeClockCard"><i class="fas fa-moon" id="nlHomeIcon"></i><div><div id="nlHomeClock">--:--</div><div id="nlHomeDate">-</div></div></div>
    <div class="nl-glass" id="nlHomeTitleCard"><i class="fas fa-earth-americas"></i><span>NLGEP</span><span class="nl-beta">BETA</span></div>
    <div class="nl-flip" id="nlFlip" title="Click to flip">
      <div class="nl-flip-inner">
        <div class="nl-face">Next Learning Generation Education Program</div>
        <div class="nl-face nl-back">Next Level Games, Entertainment, and Proxies</div>
      </div>
    </div>
    <div class="nl-home-actions"><a class="tool-btn primary" href="/chat"><i class="fas fa-comments"></i>Join the Chat</a></div>
    <div class="nl-fine">Chat with everyone on the InfiNet global lobby</div>
  </div></div>
</section>

<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  function tick(){
    var d=new Date(), h=d.getHours();
    $('nlHomeClock').textContent=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
    $('nlHomeDate').textContent=d.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'});
    $('nlHomeIcon').className='fas '+(h>=6&&h<18?'fa-sun':'fa-moon');
  }
  tick(); setInterval(tick,20000);
  var flip=$('nlFlip'), timer;
  function start(){clearInterval(timer);timer=setInterval(function(){flip.classList.toggle('flipped')},5000)}
  flip.addEventListener('click',function(){flip.classList.toggle('flipped');start()});
  start();
})();
</script>
</body>
</html>
