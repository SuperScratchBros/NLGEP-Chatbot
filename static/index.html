<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css">
<style>
:root{--bg:#eef1f4;--panel:#fff;--ink:#1b2430;--muted:#66717f;--line:#d9dfe6;--me:#1f4fd8;--me-ink:#fff;--bot:#e6ebf1}
@media (prefers-color-scheme:dark){:root{--bg:#12161c;--panel:#1a2029;--ink:#e6ebf1;--muted:#8d98a6;--line:#2a323d;--me:#3d6df0;--bot:#242c37}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:760px;height:100%;display:flex;flex-direction:column;background:var(--panel);border-inline:1px solid var(--line)}
header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
header h1{font-size:17px;margin:0;font-weight:650}
header button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:4px 10px;cursor:pointer;font:inherit;font-size:14px}
#log{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:85%;padding:10px 14px;border-radius:14px;overflow-wrap:anywhere}
.me{white-space:pre-wrap;align-self:flex-end;background:var(--me);color:var(--me-ink);border-bottom-right-radius:4px}
.bot{align-self:flex-start;background:var(--bot);border-bottom-left-radius:4px}
.status{align-self:flex-start;color:var(--muted);font-size:14px}
.sources{margin-top:8px;font-size:13px;white-space:normal}
.sources a{display:block;color:var(--muted);text-decoration:underline;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{margin:auto;text-align:center;color:var(--muted);max-width:32ch}
form{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
textarea{flex:1;resize:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;max-height:140px}
textarea:focus,button:focus-visible{outline:2px solid var(--me);outline-offset:1px}
form button{background:var(--me);color:var(--me-ink);border:0;border-radius:10px;padding:0 18px;font:inherit;font-weight:600;cursor:pointer}
form button:disabled{opacity:.5;cursor:default}
.md>:first-child{margin-top:0}.md>:last-child{margin-bottom:0}
.md p,.md ul,.md ol,.md pre,.md blockquote,.md table{margin:.6em 0}
.md ul,.md ol{padding-left:1.4em}.md li{margin:.2em 0}
.md h1,.md h2,.md h3,.md h4{font-size:1.05em;line-height:1.3;margin:.9em 0 .4em}
.md a{color:inherit;text-decoration:underline}
.md code{background:rgba(127,127,127,.2);padding:.1em .35em;border-radius:4px;font-size:.9em}
.md pre{background:rgba(127,127,127,.15);padding:10px 12px;border-radius:8px;overflow-x:auto}
.md pre code{background:none;padding:0}
.md blockquote{margin-left:0;padding-left:12px;border-left:3px solid var(--line);color:var(--muted)}
.md table{display:block;max-width:100%;overflow-x:auto;border-collapse:collapse}
.md th,.md td{border:1px solid var(--line);padding:4px 10px;text-align:left}
.md hr{border:0;border-top:1px solid var(--line)}
.md .katex-display{overflow-x:auto;overflow-y:hidden;padding:2px 0}
</style>
</head>
<body>
<main>
  <header><h1>Chat</h1><button id="clear" type="button">New chat</button></header>
  <div id="log" aria-live="polite"></div>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Ask anything" aria-label="Message"></textarea>
    <button id="send">Send</button>
  </form>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"></script>
<script>
if (window.DOMPurify) DOMPurify.addHook("afterSanitizeAttributes", n => {
  if (n.tagName === "A") { n.setAttribute("target", "_blank"); n.setAttribute("rel", "noopener noreferrer"); }
});

// Markdown + LaTeX -> safe HTML. Returns null if the libraries failed to load.
function renderMarkdown(src) {
  if (!window.marked || !window.DOMPurify) return null;
  const maths = [];
  const stash = (tex, display, raw) => {
    if (!window.katex) return raw;
    try { maths.push(katex.renderToString(tex.trim(), { displayMode: display, throwOnError: false })); }
    catch (e) { return raw; }
    return "MATHPH" + (maths.length - 1) + "END";
  };
  // Leave code blocks and inline code untouched (odd indexes are code)
  const text = src.split(/(```[\s\S]*?```|`[^`\n]*`)/g).map((p, i) => i % 2 ? p : p
    .replace(/\$\$([\s\S]+?)\$\$/g, (m, t) => stash(t, true, m))
    .replace(/\\\[([\s\S]+?)\\\]/g, (m, t) => stash(t, true, m))
    .replace(/\\\(([\s\S]+?)\\\)/g, (m, t) => stash(t, false, m))
    .replace(/(?<![\\$\w])\$(?![\s$])((?:\\.|[^$\\\n])+?)(?<![\s\\])\$(?![\d$\w])/g, (m, t) => stash(t, false, m))
  ).join("");
  const html = DOMPurify.sanitize(marked.parse(text, { gfm: true, breaks: true }));
  return html.replace(/MATHPH(\d+)END/g, (m, n) => maths[n] ?? m);
}

const log = document.getElementById("log"), input = document.getElementById("input"),
      send = document.getElementById("send"), form = document.getElementById("form");
let messages = [];
try { messages = JSON.parse(localStorage.getItem("chat") || "[]"); } catch (e) {}

function save() { try { localStorage.setItem("chat", JSON.stringify(messages)); } catch (e) {} }

function add(role, text, sources) {
  const d = document.createElement("div");
  d.className = "msg " + (role === "user" ? "me" : "bot");
  if (role === "user") d.textContent = text;
  else {
    const body = document.createElement("div"); body.className = "md";
    const html = renderMarkdown(text);
    if (html === null) { body.style.whiteSpace = "pre-wrap"; body.textContent = text; } else body.innerHTML = html;
    d.appendChild(body);
  }
  if (sources && sources.length) {
    const s = document.createElement("div"); s.className = "sources";
    sources.forEach(x => { const a = document.createElement("a"); a.href = x.url; a.target = "_blank"; a.rel = "noopener"; a.textContent = x.title; s.appendChild(a); });
    d.appendChild(s);
  }
  log.appendChild(d); log.scrollTop = log.scrollHeight;
  return d;
}

function render() {
  log.innerHTML = "";
  if (!messages.length) {
    log.innerHTML = '<p class="empty">Ask a question. I can search the web for current information.</p>';
    return;
  }
  messages.forEach(m => add(m.role, m.content, m.sources));
}

form.addEventListener("submit", async e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || send.disabled) return;
  if (!messages.length) log.innerHTML = "";
  messages.push({ role: "user", content: text });
  const bubble = add("user", text); input.value = ""; input.style.height = "auto"; send.disabled = true;

  const status = document.createElement("div"); status.className = "status"; status.textContent = "Thinking...";
  log.appendChild(status); log.scrollTop = log.scrollHeight;
  const wake = setTimeout(() => status.textContent = "The server is waking up. This can take up to a minute.", 6000);

  try {
    const res = await fetch("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: messages.map(({ role, content }) => ({ role, content })) })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : "Request failed");
    messages.push({ role: "assistant", content: data.reply, sources: data.sources });
    status.remove(); add("assistant", data.reply, data.sources); save();
  } catch (err) {
    messages.pop(); bubble.remove(); input.value = text;
    status.textContent = "Error: " + err.message + " Your message is back in the box. Send it again.";
  } finally { clearTimeout(wake); send.disabled = false; input.focus(); }
});

input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });
input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = input.scrollHeight + "px"; });
document.getElementById("clear").onclick = () => { messages = []; save(); render(); };
render();
</script>
</body>
</html>
