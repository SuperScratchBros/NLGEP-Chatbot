<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infinity Network</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Arial,sans-serif;background:#fff;color:#000;overflow:hidden}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center}
.logo{font-size:clamp(56px,10vw,110px);font-weight:700;margin:0 0 10px}
.title{font-size:clamp(34px,6vw,64px);font-weight:700;margin:0}
.sub{margin:8px 0 34px;font-size:18px}
.buttons{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
button{min-width:190px;padding:14px 24px;background:#fff;color:#000;border:1px solid #000;border-radius:2px;font:700 18px Arial,sans-serif;cursor:pointer}
button:hover{background:#f2f2f2}
.card{margin-top:22px;padding:14px 18px;border:1px solid #000;background:#fff;max-width:560px;font-size:14px;line-height:1.5}
.footer{position:absolute;bottom:18px;font-size:12px}
</style>
</head>
<body>
<main>
  <h1 class="logo">∞</h1>
  <div class="title">Infinity Network</div>
  <div class="sub">InfiNet</div>
  <div class="buttons">
    <button onclick="location.href='/ai'">NLGEP AI</button>
    <button onclick="location.href='/chat'">Chatting</button>
  </div>
  <div class="card">Connect with NLGEP AI or join the InfiNet global conversation.</div>
  <div class="footer">Infinity Network · InfiNet</div>
</main>
</body>
</html>
