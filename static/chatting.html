<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infinity Network — Chatting</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Arial,sans-serif;background:#fff;color:#000}
button,input{font:inherit}
.app{height:100%;display:grid;grid-template-columns:240px 1fr;overflow:hidden}
.sidebar{padding:16px;border-right:1px solid #000;background:#fff;display:flex;flex-direction:column;gap:12px}
.brand{font-weight:700;font-size:20px}
.muted{color:#000;font-size:13px}
.online{padding:10px 12px;border:1px solid #000;background:#fff}
.users{overflow:auto;display:flex;flex-direction:column;gap:6px}
.user{padding:7px 9px;border:1px solid #000;background:#fff;font-size:13px}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid #000;background:#fff}
.content{display:flex;flex-direction:column;min-width:0}
.messages{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:min(720px,80%);padding:10px 12px;border:1px solid #000;background:#fff}
.msg.me{align-self:flex-end}
.name{font-size:12px;font-weight:700;margin-bottom:3px}
.time{font-size:10px;margin-top:4px}
.composer{display:flex;gap:8px;padding:12px;border-top:1px solid #000;background:#fff}
input{flex:1;min-width:0;background:#fff;color:#000;border:1px solid #000;border-radius:2px;padding:11px 12px;outline:none}
input:focus{outline:2px solid #000;outline-offset:1px}
button{border:1px solid #000;background:#fff;color:#000;border-radius:2px;padding:10px 16px;cursor:pointer;font-weight:700}
button:hover{background:#f2f2f2}
.overlay{position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}
.login{width:min(440px,100%);padding:24px;border:1px solid #000;background:#fff}
.login h1{margin-top:0}
.login p{line-height:1.5}
.login form{display:flex;gap:8px}
.login .error{min-height:20px;margin-top:10px}
.home{width:100%}
@media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{display:none}.msg{max-width:90%}}
</style>
</head>
<body>
<div id="overlay" class="overlay"><div class="login">
<h1>Enter InfiNet</h1><p>Choose a unique username. This creates your chat identity on Infinity Network.</p>
<form id="loginForm"><input id="username" maxlength="24" autocomplete="off" placeholder="Username"><button>Join</button></form>
<div id="loginError" class="error"></div></div></div>
<div class="app">
<aside class="sidebar"><div class="brand">∞ InfiNet</div><button class="home" onclick="location.href='/'">Home</button>
<div class="online"><strong id="onlineCount">0 online</strong><div class="muted">Active in the lobby</div></div><div class="muted">People here</div><div id="users" class="users"></div></aside>
<section class="content"><div class="top"><div><strong>Global Chat</strong><div class="muted">Talk with other Infinity Network users</div></div><button id="logout">Leave</button></div>
<div id="messages" class="messages"></div>
<form id="composer" class="composer"><input id="messageInput" maxlength="2000" autocomplete="off" placeholder="Message InfiNet…"><button>Send</button></form></section>
</div>
<script>
const overlay=document.getElementById("overlay"),loginForm=document.getElementById("loginForm"),username=document.getElementById("username"),loginError=document.getElementById("loginError"),messagesEl=document.getElementById("messages"),usersEl=document.getElementById("users"),onlineCount=document.getElementById("onlineCount"),input=document.getElementById("messageInput");
let lastMessageId="",pollId=null,polling=false;
function fmt(t){try{return new Date(t).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})}catch(e){return""}}
function draw(rows,me){
  const shouldStick=messagesEl.scrollHeight-messagesEl.scrollTop-messagesEl.clientHeight<80;
  rows.forEach(m=>{
    const d=document.createElement("div");
    d.className="msg"+(m.username===me?" me":"");
    d.innerHTML='<div class="name"></div><div class="body"></div><div class="time"></div>';
    d.querySelector(".name").textContent=m.username;
    d.querySelector(".body").textContent=m.content;
    d.querySelector(".time").textContent=fmt(m.created_at);
    messagesEl.appendChild(d);
  });
  if(shouldStick)messagesEl.scrollTop=messagesEl.scrollHeight;
}
async function refreshMessages(){
  if(polling)return;
  polling=true;
  try{
    const url=lastMessageId?"/api/chat-messages?after="+encodeURIComponent(lastMessageId):"/api/chat-messages";
    const r=await fetch(url,{credentials:"same-origin"});
    if(r.status===401){overlay.style.display="flex";clearInterval(pollId);pollId=null;return}
    if(!r.ok)return;
    const d=await r.json();
    draw(d.messages,d.me);
    if(d.messages.length)lastMessageId=String(d.messages[d.messages.length-1].message_id);
  }catch(e){}finally{polling=false}
}
async function refreshUsers(){
  try{
    const r=await fetch("/api/chat-users",{credentials:"same-origin"});
    if(r.status===401){overlay.style.display="flex";clearInterval(pollId);pollId=null;return}
    if(!r.ok)return;
    const d=await r.json();
    onlineCount.textContent=d.count+" online";
    usersEl.innerHTML="";
    d.users.forEach(u=>{const x=document.createElement("div");x.className="user";x.textContent=u.username;usersEl.appendChild(x)});
  }catch(e){}
}
async function start(){
  try{
    const r=await fetch("/api/chat-me",{credentials:"same-origin"});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){
      loginError.textContent=d.detail||"Could not connect to InfiNet.";
      return;
    }
    if(d.user){
      overlay.style.display="none";
      loginError.textContent="";
      clearInterval(pollId);
      lastMessageId="";
      await refreshMessages();
      await refreshUsers();
      pollId=setInterval(()=>{refreshMessages();refreshUsers()},1500);
    }
  }catch(e){loginError.textContent="Could not connect to InfiNet. Please try again."}
}
loginForm.onsubmit=async e=>{e.preventDefault();loginError.textContent="";try{const r=await fetch("/api/chat-session",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:username.value.trim()})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||"Could not join.");overlay.style.display="none";messagesEl.innerHTML="";lastMessageId="";await start()}catch(err){loginError.textContent=err.message}}
document.getElementById("composer").onsubmit=async e=>{e.preventDefault();const content=input.value.trim();if(!content)return;input.value="";try{const r=await fetch("/api/chat-messages",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({content})});if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.detail||"Send failed.")}const d=await r.json();draw([d.message],d.message.username);lastMessageId=String(d.message.message_id)}catch(err){input.value=content;alert(err.message)}}
document.getElementById("logout").onclick=async()=>{await fetch("/api/chat-session",{method:"DELETE",credentials:"same-origin"});clearInterval(pollId);location.reload()};start();
</script></body></html>
